<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <meta name="description"
        content="Explore e baixe livros digitais (PDF, EPUB, MOBI). Compartilhe seus títulos e descubra novas leituras.">
    <meta property="og:title" content="Biblioteca Digital">
    <meta property="og:description"
        content="Explore e baixe livros digitais (PDF, EPUB, MOBI). Compartilhe seus títulos e descubra novas leituras.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://brianmunizsilveira.github.io/projeto_pdf/">
    <meta property="og:site_name" content="Biblioteca Digital">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:image:alt" content="Biblioteca Digital">
    <meta property="og:image" content="https://brianmunizsilveira.github.io/projeto_pdf/books/covers/o-processo.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Biblioteca Digital">
    <meta name="twitter:description"
        content="Explore e baixe livros digitais (PDF, EPUB, MOBI). Compartilhe seus títulos e descubra novas leituras.">
    <meta name="twitter:image" content="https://brianmunizsilveira.github.io/projeto_pdf/books/covers/o-processo.jpg">
    <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">📚</div>
                    <span>Biblioteca Digital</span>
                </div>
                <div class="search-container">
                    <select id="type-filter" aria-label="Filtrar formato" class="select">
                        <option value="all">Formatos</option>
                        <option value="pdf">PDF</option>
                        <option value="epub">EPUB</option>
                        <option value="mobi">MOBI</option>
                    </select>
                    <select id="sort-by" aria-label="Ordenar por" class="select">
                        <option value="relevance" selected>Ordenar: Relevância</option>
                        <option value="title-asc">Ordenar: Título (A-Z)</option>
                        <option value="title-desc">Ordenar: Título (Z-A)</option>
                        <option value="year-desc">Ordenar: Ano (↓)</option>
                        <option value="size-desc">Ordenar: Tamanho (↓)</option>
                        <option value="rating-desc">Ordenar: Rating (↓)</option>
                    </select>
                    <select id="grid-size" aria-label="Tamanho da grade" class="select">
                        <option value="compact">Grade: Compacta</option>
                        <option value="standard" selected>Grade: Padrão</option>
                        <option value="comfortable">Grade: Confortável</option>
                    </select>
                    <select id="page-size" aria-label="Itens por página" class="select">
                        <option value="10">Exibir: 10</option>
                        <option value="20" selected>Exibir: 20</option>
                        <option value="40">Exibir: 40</option>
                        <option value="80">Exibir: 80</option>
                    </select>
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="search" id="search" placeholder="Buscar por título, autor ou descrição...">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="total-count">0</span>
                <span class="stat-label">Total de Livros</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="filtered-count">0</span>
                <span class="stat-label">Resultados</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="total-size">0 MB</span>
                <span class="stat-label">Biblioteca</span>
            </div>
            <button id="perf-toggle" class="btn btn-secondary" style="margin-left:auto;">⏱️ Métricas</button>
        </div>
        <div id="perf-panel" class="perf-panel" hidden></div>
        <div class="view-toggle" aria-label="Alternar visualização">
            <button class="view-btn active" data-view="grid">🔲 Grid</button>
            <button class="view-btn" data-view="list">📋 Lista</button>
            <button class="view-btn" data-view="compact">📄 Compacto</button>
        </div>
        <div class="filters-panel">
            <div id="filters-grid" class="filters-grid" hidden>
                <fieldset class="filter-section">
                    <legend>Categoria</legend>
                    <label><input type="checkbox" class="category-check" value="ficção"> Ficção</label>
                    <label><input type="checkbox" class="category-check" value="técnico"> Técnico</label>
                    <label><input type="checkbox" class="category-check" value="auto-ajuda"> Auto-ajuda</label>
                    <!-- <label><input type="checkbox" class="category-check" value="romance"> Romance</label>
                    <label><input type="checkbox" class="category-check" value="aventura"> Aventura</label>
                    <label><input type="checkbox" class="category-check" value="mistério"> Mistério</label>
                    <label><input type="checkbox" class="category-check" value="fantasia"> Fantasia</label>
                    <label><input type="checkbox" class="category-check" value="história"> História</label>
                    <label><input type="checkbox" class="category-check" value="biografia"> Biografia</label>
                    <label><input type="checkbox" class="category-check" value="negócios"> Negócios</label>
                    <label><input type="checkbox" class="category-check" value="programação"> Programação</label>
                    <label><input type="checkbox" class="category-check" value="ciência"> Ciência</label>
                    <label><input type="checkbox" class="category-check" value="filosofia"> Filosofia</label>
                    <label><input type="checkbox" class="category-check" value="religião"> Religião</label>
                    <label><input type="checkbox" class="category-check" value="psicologia"> Psicologia</label>
                    <label><input type="checkbox" class="category-check" value="educação"> Educação</label>
                    <label><input type="checkbox" class="category-check" value="direito"> Direito</label>
                    <label><input type="checkbox" class="category-check" value="medicina"> Medicina</label>
                    <label><input type="checkbox" class="category-check" value="arte"> Arte</label>
                    <label><input type="checkbox" class="category-check" value="música"> Música</label>
                    <label><input type="checkbox" class="category-check" value="culinária"> Culinária</label> -->
                </fieldset>
            </div>
        </div>


        <ul id="pdf-list"></ul>

        <div id="empty" hidden>
            <div class="empty-icon">📖</div>
            <h2 class="empty-title">Nenhum PDF encontrado</h2>
            <p style="color: var(--text-muted);">Adicione seus livros ao arquivo pdfs.json</p>
        </div>
    </main>

    <footer>
        <p>Open Source Project. <span id="year"></span> Biblioteca Digital. Feito com ❤️ para amantes da leitura.</p>
    </footer>

    <div id="toast"></div>
    <div id="modal-backdrop" class="modal-backdrop" hidden></div>
    <div id="desc-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="desc-modal-title" hidden>
        <div class="modal-header">
            <h3 id="desc-modal-title" class="modal-title">Descrição completa</h3>
            <button id="desc-modal-close" class="btn btn-secondary" aria-label="Fechar">✖</button>
        </div>
        <div id="desc-modal-body" class="modal-body"></div>
    </div>

    <script src="./assets/script.js"></script>
</body>

</html>
